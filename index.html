```html
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temassız Girişim — Dijital Randevu Sistemi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       RENK PALETİ DEĞİŞKENLERİ (TEMA RENKLERİNİ BURADAN KOLAYCA DEĞİŞTİREBİLİRSİNİZ)
       ========================================================================== */
    :root {
      --bg-page: #131a24;               /* Sayfa dış arka planı */
      --bg-widget: #212b38;             /* Ana takvim ve kart yüzeyi (görseldeki koyu lacivert/arduvaz) */
      --bg-widget-elevated: #283444;    /* İkincil kart ve input alanları */
      --bg-cell-hover: #2d3a4b;         /* Takvim hücresi üzerine gelince */
      --border-grid: #374457;           /* Takvim çizgileri ve kenarlıklar */
      --text-primary: #f8fafc;          /* Ana beyaz metin */
      --text-secondary: #9ca3af;        /* İkincil / hafta sonu soluk gri metin */
      --text-muted: #6b7280;            /* Pasif gün numaraları */
      --accent-primary: #b4cdfa;        /* Görseldeki yumuşak buz mavisi ana buton ve seçili gün rengi */
      --accent-primary-hover: #9ec0f8;  /* Ana buton hover rengi */
      --accent-primary-text: #111827;   /* Buz mavisi üzerindeki koyu metin/ikon */
      --tag-blue-bg: #4b74b8;           /* Takvim içi mavi etkinlik etiketi */
      --tag-teal-bg: #3b8577;           /* Takvim içi yeşil/turkuaz etkinlik etiketi */
      --tag-amber-bg: #b4692e;          /* Onay bekleyen / acil randevu etiketi */
      --danger-bg: #dc2626;             /* Sil / Reddet butonu */
      --danger-hover: #b91c1c;
      --success-bg: #16a34a;            /* Onayla / WhatsApp butonu */
      --success-hover: #15803d;
      --radius-widget: 26px;
      --radius-card: 18px;
      --radius-pill: 9999px;
      --shadow-widget: 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Üst Navigasyon / Marka Çubuğu */
    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 16px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--accent-primary);
      color: var(--accent-primary-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 6px 16px rgba(180, 205, 250, 0.25);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .panel-switch-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-widget);
      padding: 5px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-grid);
    }

    .panel-tab-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .panel-tab-btn.active {
      background: var(--accent-primary);
      color: var(--accent-primary-text);
    }

    .panel-tab-btn:not(.active):hover {
      color: var(--text-primary);
    }

    /* Ana Konteyner */
    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 16px 48px;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Görseldeki Ana Takvim Kartı Stili */
    .calendar-widget {
      background-color: var(--bg-widget);
      border-radius: var(--radius-widget);
      box-shadow: var(--shadow-widget);
      border: 1px solid var(--border-grid);
      overflow: hidden;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px 16px;
      gap: 12px;
    }

    .calendar-month-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .calendar-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-arrow-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-arrow-btn:hover {
      background: var(--bg-widget-elevated);
      color: var(--text-primary);
    }

    /* Görseldeki sağ üst büyük yuvarlak '+' hap butonu */
    .pill-plus-btn {
      width: 74px;
      height: 44px;
      border-radius: var(--radius-pill);
      border: none;
      background-color: var(--accent-primary);
      color: var(--accent-primary-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      box-shadow: 0 4px 14px rgba(180, 205, 250, 0.25);
    }

    .pill-plus-btn:hover {
      background-color: var(--accent-primary-hover);
      transform: translateY(-1px);
    }

    .pill-plus-btn:active {
      transform: scale(0.97);
    }

    /* Haftanın Günleri Başlığı (P S Ç P C C P) */
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      padding: 6px 0 10px;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-grid);
    }

    /* Takvim Izgarası */
    .calendar-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .calendar-cell {
      min-height: 76px;
      border-right: 1px solid var(--border-grid);
      border-bottom: 1px solid var(--border-grid);
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .calendar-cell:nth-child(7n) {
      border-right: none;
    }

    .calendar-cell:hover {
      background-color: var(--bg-cell-hover);
    }

    .calendar-cell.selected-cell {
      background-color: rgba(180, 205, 250, 0.08);
    }

    .day-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .calendar-cell.other-month .day-number {
      color: var(--text-muted);
    }

    /* Görseldeki 28 numaralı gün gibi buz mavisi dairesel rozet */
    .calendar-cell.is-selected .day-number {
      background-color: var(--accent-primary);
      color: var(--accent-primary-text);
      font-weight: 700;
    }

    .calendar-cell.is-today:not(.is-selected) .day-number {
      border: 1.5px solid var(--accent-primary);
      color: var(--accent-primary);
    }

    /* Takvim Hücresi İçi KVKK Maskeli Randevu Etiketleri */
    .cell-events {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .event-pill {
      width: 100%;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 5px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
      line-height: 1.25;
    }

    .event-pill.confirmed {
      background-color: var(--tag-teal-bg);
    }

    .event-pill.pending {
      background-color: var(--tag-blue-bg);
    }

    .event-pill.urgent {
      background-color: var(--tag-amber-bg);
    }

    .event-more-badge {
      font-size: 0.65rem;
      color: var(--accent-primary);
      font-weight: 600;
      text-align: center;
    }

    .calendar-footer-legend {
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.76rem;
      color: var(--text-secondary);
      background: rgba(17, 24, 39, 0.25);
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 5px;
    }

    /* Sağ Panel / Form Kartları */
    .card {
      background-color: var(--bg-widget);
      border-radius: var(--radius-widget);
      border: 1px solid var(--border-grid);
      padding: 22px;
      box-shadow: var(--shadow-widget);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-desc {
      font-size: 0.83rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input,
    .form-select {
      width: 100%;
      background-color: var(--bg-widget-elevated);
      border: 1px solid var(--border-grid);
      color: var(--text-primary);
      padding: 11px 14px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-input:focus,
    .form-select:focus {
      border-color: var(--accent-primary);
    }

    /* Saat Slotları Izgarası */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    @media (max-width: 480px) {
      .slots-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .calendar-cell {
        min-height: 68px;
        padding: 4px 2px;
      }
      .event-pill {
        font-size: 0.62rem;
        padding: 2px 3px;
      }
    }

    .slot-btn {
      padding: 10px 6px;
      border-radius: 12px;
      border: 1px solid var(--border-grid);
      background-color: var(--bg-widget-elevated);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s ease;
    }

    .slot-btn:hover:not(:disabled) {
      border-color: var(--accent-primary);
      background-color: var(--bg-cell-hover);
    }

    .slot-btn.selected {
      background-color: var(--accent-primary);
      color: var(--accent-primary-text);
      border-color: var(--accent-primary);
    }

    .slot-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .slot-btn.urgent-unlocked {
      border-color: #f59e0b;
      background-color: rgba(245, 158, 11, 0.14);
    }

    .slot-sub {
      font-size: 0.66rem;
      font-weight: 500;
      opacity: 0.85;
    }

    /* Aciliyet Durumu Butonu */
    .emergency-toggle-btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px dashed #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: all 0.15s ease;
    }

    .emergency-toggle-btn.active {
      background: #f59e0b;
      color: #111827;
      border-style: solid;
    }

    /* Hizmet Seçim Kartları */
    .services-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 480px) {
      .services-list {
        grid-template-columns: 1fr;
      }
    }

    .service-chip {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border-grid);
      background: var(--bg-widget-elevated);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.84rem;
      transition: all 0.15s ease;
      text-align: left;
    }

    .service-chip.selected {
      border-color: var(--accent-primary);
      background: rgba(180, 205, 250, 0.16);
    }

    .service-price {
      font-weight: 700;
      color: var(--accent-primary);
      white-space: nowrap;
    }

    /* Ana Butonlar */
    .btn-primary {
      width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius-pill);
      border: none;
      background-color: var(--accent-primary);
      color: var(--accent-primary-text);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-primary-hover);
    }

    .btn-whatsapp {
      width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius-pill);
      border: none;
      background-color: #25d366;
      color: #0b141a;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: filter 0.15s ease, transform 0.1s ease;
    }

    .btn-whatsapp:hover {
      filter: brightness(1.06);
    }

    .btn-sm {
      padding: 7px 12px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-sm:hover {
      opacity: 0.9;
    }

    .btn-confirm {
      background: var(--success-bg);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger-bg);
      color: #fff;
    }

    /* İşletme Paneli Düzeni */
    .business-stack {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .appointment-item {
      background: var(--bg-widget-elevated);
      border: 1px solid var(--border-grid);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .badge-pending {
      background: rgba(75, 116, 184, 0.25);
      color: #93c5fd;
    }

    .badge-confirmed {
      background: rgba(59, 133, 119, 0.28);
      color: #6ee7b7;
    }

    .badge-urgent {
      background: rgba(245, 158, 11, 0.25);
      color: #fcd34d;
    }

    .inline-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 540px) {
      .inline-form-row {
        grid-template-columns: 1fr;
      }
    }

    .manage-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg-widget-elevated);
      border: 1px solid var(--border-grid);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    /* Modal & Bildirim (Toast) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 20, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-widget);
      border: 1px solid var(--border-grid);
      border-radius: var(--radius-widget);
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: var(--shadow-widget);
    }

    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: var(--bg-widget-elevated);
      border: 1px solid var(--accent-primary);
      color: var(--text-primary);
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      z-index: 2000;
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.25s ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Üst Başlık ve Panel Geçişi -->
  <header class="topbar">
    <div class="brand-box">
      <div class="brand-logo" id="headerBrandInitial">T</div>
      <div>
        <div class="brand-title" id="headerBusinessName">Temassız Girişim</div>
        <div class="brand-subtitle" id="headerBusinessHours">Çalışma Saatleri: 09:00 - 21:00 • Online Randevu</div>
      </div>
    </div>

    <div class="panel-switch-group">
      <button type="button" class="panel-tab-btn active" id="tabCustomerBtn" onclick="switchToCustomer()">
        Müşteri Paneli
      </button>
      <button type="button" class="panel-tab-btn" id="tabBusinessBtn" onclick="openBusinessLogin()">
        İşletme Paneli
      </button>
    </div>
  </header>

  <!-- ========================================================================
       1. PANEL: MÜŞTERİ PANELİ (SAYFA AÇILIR AÇILMAZ GÖRÜNÜR)
       ======================================================================== -->
  <main class="container" id="customerPanelView">
    <div class="grid-layout">
      <!-- Sol Kolon: Görseldeki Koyu Lacivert Aylık Takvim -->
      <section class="calendar-widget" aria-label="Randevu Takvimi">
        <div class="calendar-header">
          <h1 class="calendar-month-title" id="custMonthTitle">Kasım 2026</h1>
          <div class="calendar-controls">
            <button type="button" class="nav-arrow-btn" id="custPrevMonth" title="Önceki Ay" aria-label="Önceki Ay">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button type="button" class="nav-arrow-btn" id="custNextMonth" title="Sonraki Ay" aria-label="Sonraki Ay">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
