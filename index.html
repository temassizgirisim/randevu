<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temassız Girişim - Randevu</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f4; color: #16201a; }
    .top { background: #113825; color: #fff; padding: 14px; border-bottom: 3px solid #d4af37; }
    .top h1 { margin: 0 0 10px; font-size: 16px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tabs button { padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #1e5238; color: #fff; }
    .tabs button.active { background: #d4af37; color: #113825; }
    .wrap { max-width: 680px; margin: 14px auto; padding: 0 12px 60px; }
    .box { background: #fff; border: 1px solid #dce3de; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .hero { background: #113825; color: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .hero h2 { margin: 6px 0 4px; }
    .btn-opt { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 8px; border: 1.5px solid #cbd5ce; border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px; }
    .btn-opt.sel { border-color: #113825; background: #e8f3ec; font-weight: bold; }
    .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .slot { padding: 10px; border: 1.5px solid #cbd5ce; border-radius: 8px; background: #fff; font-weight: bold; cursor: pointer; }
    .slot.sel { background: #d4af37; border-color: #113825; }
    .slot.busy { background: #eee; color: #999; text-decoration: line-through; cursor: not-allowed; }
    input, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #c5d0c8; border-radius: 8px; font-size: 14px; }
    .main-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #113825; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
    .gold-btn { width: 100%; padding: 11px; border: none; border-radius: 10px; background: #d4af37; color: #113825; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .appt { border: 1px solid #dce3de; border-radius: 10px; padding: 10px; margin-bottom: 8px; background: #fafcfb; }
    .small-btn { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin-right: 6px; margin-top: 6px; }
    .ok { background: #1b7a46; color: #fff; }
    .del { background: #c93b3b; color: #fff; }
    .hide { display: none; }
  </style>
</head>
<body>

  <div class="top">
    <h1>Temassız Girişim — Dijital Randevu</h1>
    <div class="tabs">
      <button type="button" id="tabCust" class="active" onclick="showPanel('cust')">Müşteri Paneli</button>
      <button type="button" id="tabAdm" onclick="showPanel('adm')">İşletmeci Paneli</button>
    </div>
  </div>

  <div class="wrap">
    <!-- MÜŞTERİ PANELİ -->
    <div id="panelCust">
      <div class="hero">
        <span>★ 7/24 Online Randevu</span>
        <h2 id="bizTitle">Atelier Pine</h2>
        <small>Hızlı randevu oluşturun</small>
      </div>

      <div class="box">
        <h3>1. Hizmet Seç</h3>
        <div id="srvList"></div>
      </div>

      <div class="box">
        <h3>2. Uzman Seç</h3>
        <div id="stfList"></div>
      </div>

      <div class="box">
        <h3>3. Saat Seç</h3>
        <div class="slots" id="slotList"></div>
      </div>

      <div class="box">
        <h3>4. Bilgileriniz</h3>
        <input type="text" id="cName" placeholder="Ad Soyad" />
        <input type="tel" id="cPhone" placeholder="Telefon (05xx...)" />
        <button type="button" class="main-btn" onclick="createAppt()">Randevuyu Kaydet</button>
        <div id="custMsg" style="margin-top:10px; font-weight:bold; color:#113825;"></div>
      </div>
    </div>

    <!-- İŞLETMECİ PANELİ -->
    <div id="panelAdm" class="hide">
      <div class="box" id="admLogin">
        <h3>İşletmeci Girişi</h3>
        <input type="password" id="admPin" placeholder="PIN (1234)" />
        <button type="button" class="main-btn" onclick="loginAdm()">Giriş Yap</button>
        <button type="button" class="gold-btn" onclick="demoAdm()">Hızlı Giriş</button>
      </div>

      <div id="admArea" class="hide">
        <div class="box">
          <h3>Gelen Randevular</h3>
          <div id="admAppts"></div>
        </div>

        <div class="box">
          <h3>Yeni Hizmet Ekle</h3>
          <input type="text" id="newSrvName" placeholder="Hizmet Adı" />
          <input type="number" id="newSrvPrice" placeholder="Fiyat (TL)" />
          <button type="button" class="main-btn" onclick="addSrv()">Hizmet Ekle</button>
        </div>

        <div class="box">
          <h3>İşletme Adı</h3>
          <input type="text" id="newBizName" placeholder="İşletme Adı" />
          <button type="button" class="gold-btn" onclick="saveBiz()">Kaydet</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var KEY = "tg_simple_randevu_v1";
    var SLOTS = ["09:30", "11:00", "13:00", "14:30", "16:00", "17:30"];

    var state = {
      bizName: "Atelier Pine",
      pin: "1234",
      services: [
        { id: "1", name: "Cilt Bakımı", price: 950 },
        { id: "2", name: "Protez Tırnak", price: 750 },
        { id: "3", name: "İpek Kirpik", price: 650 }
      ],
      staff: [
        { id: "a", name: "Selin Kaya" },
        { id: "b", name: "Elif Demir" }
      ],
      appts: [
        { id: "101", name: "Merve Aydın", phone: "05320001122", srvId: "1", stfId: "a", time: "11:00", status: "Onaylandı" }
      ],
      selSrv: "1",
      selStf: "a",
      selTime: null
    };

    try {
      var saved = localStorage.getItem(KEY);
      if (saved) {
        var p = JSON.parse(saved);
        if (p && p.services && p.staff && p.appts) {
          state.bizName = p.bizName || state.bizName;
          state.pin = p.pin || state.pin;
          state.services = p.services;
          state.staff = p.staff;
          state.appts = p.appts;
          state.selSrv = state.services[0] ? state.services[0].id : null;
          state.selStf = state.staff[0] ? state.staff[0].id : null;
        }
      }
    } catch (e) {}

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    function showPanel(which) {
      var isCust = which === "cust";
      document.getElementById("panelCust").className = isCust ? "" : "hide";
      document.getElementById("panelAdm").className = isCust ? "hide" : "";
      document.getElementById("tabCust").className = isCust ? "active" : "";
      document.getElementById("tabAdm").className = isCust ? "" : "active";
      render();
    }

    function pickSrv(id) { state.selSrv = id; render(); }
    function pickStf(id) { state.selStf = id; render(); }
    function pickTime(t) { state.selTime = t; render(); }

    function createAppt() {
      var name = document.getElementById("cName").value.trim();
      var phone = document.getElementById("cPhone").value.trim();
      var msg = document.getElementById("custMsg");

      if (!state.selTime) { msg.textContent = "Lütfen bir saat seçin."; return; }
      if (!name || !phone) { msg.textContent = "Lütfen ad soyad ve telefon girin."; return; }

      state.appts.push({
        id: String(Date.now()).slice(-4),
        name: name,
        phone: phone,
        srvId: state.selSrv,
        stfId: state.selStf,
        time: state.selTime,
        status: "Bekliyor"
      });
      save();
      msg.textContent = "Randevunuz kaydedildi! Saat: " + state.selTime;
      state.selTime = null;
      document.getElementById("cName").value = "";
      document.getElementById("cPhone").value = "";
      render();
    }

    function loginAdm() {
      var pin = document.getElementById("admPin").value.trim();
      if (pin === state.pin) {
        demoAdm();
      } else {
        alert("PIN yanlış (1234)");
      }
    }

    function demoAdm() {
      document.getElementById("admLogin").className = "hide";
      document.getElementById("admArea").className = "";
      renderAdm();
    }

    function setApptStatus(id, st) {
      for (var i = 0; i < state.appts.length; i++) {
        if (state.appts[i].id === id) state.appts[i].status = st;
      }
      save();
      renderAdm();
      render();
    }

    function delAppt(id) {
      state.appts = state.appts.filter(function (a) { return a.id !== id; });
      save();
      renderAdm();
      render();
    }

    function addSrv() {
      var n = document.getElementById("newSrvName").value.trim();
      var pr = parseInt(document.getElementById("newSrvPrice").value, 10) || 0;
      if (!n) return;
      state.services.push({ id: String(Date.now()), name: n, price: pr });
      save();
      document.getElementById("newSrvName").value = "";
      document.getElementById("newSrvPrice").value = "";
      render();
    }

    function saveBiz() {
      var b = document.getElementById("newBizName").value.trim();
      if (!b) return;
      state.bizName = b;
      save();
      render();
      alert("Kaydedildi");
    }

    function getSrvName(id) {
      for (var i = 0; i < state.services.length; i++) {
        if (state.services[i].id === id) return state.services[i].name + " (" + state.services[i].price + " TL)";
      }
      return "Hizmet";
    }

    function getStfName(id) {
      for (var i = 0; i < state.staff.length; i++) {
        if (state.staff[i].id === id) return state.staff[i].name;
      }
      return "Uzman";
    }

    function render() {
      document.getElementById("bizTitle").textContent = state.bizName;
      document.getElementById("newBizName").value = state.bizName;

      var sHtml = "";
      for (var i = 0; i < state.services.length; i++) {
        var s = state.services[i];
        var cls = s.id === state.selSrv ? "btn-opt sel" : "btn-opt";
        sHtml += '<button type="button" class="' + cls + '" onclick="pickSrv(\'' + s.id + '\')">' + s.name + " — " + s.price + " TL</button>";
      }
      document.getElementById("srvList").innerHTML = sHtml;

      var fHtml = "";
      for (var j = 0; j < state.staff.length; j++) {
        var f = state.staff[j];
        var fCls = f.id === state.selStf ? "btn-opt sel" : "btn-opt";
        fHtml += '<button type="button" class="' + fCls + '" onclick="pickStf(\'' + f.id + '\')">' + f.name + "</button>";
      }
      document.getElementById("stfList").innerHTML = fHtml;

      var busyTimes = [];
      for (var k = 0; k < state.appts.length; k++) {
        if (state.appts[k].stfId === state.selStf && state.appts[k].status !== "İptal") {
          busyTimes.push(state.appts[k].time);
        }
      }

      var tHtml = "";
      for (var m = 0; m < SLOTS.length; m++) {
        var tm = SLOTS[m];
        var isBusy = busyTimes.indexOf(tm) !== -1;
        if (isBusy) {
          tHtml += '<button type="button" class="slot busy" disabled>' + tm + "</button>";
        } else {
          var tCls = state.selTime === tm ? "slot sel" : "slot";
          tHtml += '<button type="button" class="' + tCls + '" onclick="pickTime(\'' + tm + '\')">' + tm + "</button>";
        }
      }
      document.getElementById("slotList").innerHTML = tHtml;
      renderAdm();
    }

    function renderAdm() {
      var box = document.getElementById("admAppts");
      if (!box) return;
      if (state.appts.length === 0) {
        box.innerHTML = "<p>Randevu yok.</p>";
        return;
      }
      var h = "";
      for (var i = 0; i < state.appts.length; i++) {
        var a = state.appts[i];
        h += '<div class="appt">' +
          "<strong>" + a.name + "</strong> (" + a.phone + ")<br/>" +
          getSrvName(a.srvId) + " • " + getStfName(a.stfId) + " • <strong>" + a.time + "</strong><br/>" +
          "Durum: <strong>" + a.status + "</strong><br/>" +
          '<button type="button" class="small-btn ok" onclick="setApptStatus(\'' + a.id + '\', \'Onaylandı\')">Onayla</button>' +
          '<button type="button" class="small-btn del" onclick="setApptStatus(\'' + a.id + '\', \'İptal\')">İptal</button>' +
          '<button type="button" class="small-btn del" onclick="delAppt(\'' + a.id + '\')">Sil</button>' +
          "</div>";
      }
      box.innerHTML = h;
    }

    render();
  </script>
</body>
</html>
